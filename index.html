<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prison Escape</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0f1115;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#181b22;border-bottom:1px solid #2d333f}
.hint{background:#f59e0b;color:#111;border:none;padding:8px 14px;border-radius:20px;font-weight:700}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:#1e232d;border:2px solid #333b48;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.card:active{border-color:#60a5fa;transform:scale(0.97)}
.ico{font-size:44px;margin-bottom:6px}
.msg{background:#1e232d;padding:10px;text-align:center;font-size:13px;color:#93c5fd;border-top:1px solid #2d333f}
.inv{background:#14171d;padding:10px 14px 18px;border-top:1px solid #2d333f}
.slots{display:flex;gap:10px;margin-top:6px}
.slot{flex:1;height:52px;background:#1e222b;border:2px dashed #333b48;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.slot.sel{border:2px solid #f59e0b;background:#2b2518}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.modal.open{display:flex}
.box{background:#1e222b;border:1px solid #475569;border-radius:16px;padding:20px;width:100%;max-width:320px;text-align:center}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;width:100%;margin-top:14px;font-size:15px}
.disp{background:#0f1115;padding:10px;font-size:24px;letter-spacing:8px;color:#4ade80;border-radius:8px;margin:12px 0;font-family:monospace}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{background:#2b313e;color:#fff;border:none;padding:14px;font-size:18px;font-weight:700;border-radius:8px}
</style>
</head>
<body>
<div class="top"><b>🔒 Cell 04 — Escape</b><button class="hint" onclick="hint()">💡 Hint (Ad)</button></div>
<div class="grid">
  <div class="card" onclick="bed()"><div class="ico">🛏️</div><b>Prison Bunk</b><small style="color:#94a3b8">Torn mattress</small></div>
  <div class="card" onclick="cal()"><div class="ico">🗓️</div><b>Wall Calendar</b><small style="color:#94a3b8">Faded markings</small></div>
  <div class="card" onclick="vent()"><div class="ico">🕳️</div><b>Air Vent</b><small style="color:#94a3b8">Screwed tight</small></div>
  <div class="card" onclick="door()"><div class="ico">🚪</div><b>Steel Door</b><small style="color:#94a3b8">4-Digit Keypad</small></div>
</div>
<div class="msg" id="msg">Tap objects around the cell to search for clues.</div>
<div class="inv"><small style="color:#64748b">INVENTORY (TAP TO EQUIP)</small>
  <div class="slots"><div class="slot" id="s0" onclick="eq(0)"></div><div class="slot" id="s1" onclick="eq(1)"></div><div class="slot" id="s2" onclick="eq(2)"></div></div>
</div>
<div class="modal" id="m1"><div class="box"><h3 id="mt"></h3><p id="mb" style="margin-top:10px;color:#cbd5e1;line-height:1.5"></p><button class="btn" onclick="cl('m1')">Close</button></div></div>
<div class="modal" id="m2"><div class="box"><h3>🔐 Door Keypad</h3><div class="disp" id="dp">----</div>
  <div class="keys">
    <button class="k" onclick="kp('1')">1</button><button class="k" onclick="kp('2')">2</button><button class="k" onclick="kp('3')">3</button>
    <button class="k" onclick="kp('4')">4</button><button class="k" onclick="kp('5')">5</button><button class="k" onclick="kp('6')">6</button>
    <button class="k" onclick="kp('7')">7</button><button class="k" onclick="kp('8')">8</button><button class="k" onclick="kp('9')">9</button>
    <button class="k" style="background:#991b1b" onclick="kp('C')">C</button><button class="k" onclick="kp('0')">0</button><button class="k" style="background:#166534" onclick="kp('OK')">OK</button>
  </div><button class="btn" style="background:#334155" onclick="cl('m2')">Cancel</button>
</div></div>
<script>
if(window.Telegram&&window.Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
let inv=[],sel=-1,hasTool=false,ventOpen=false,code="";
function pop(t,b){document.getElementById("mt").innerText=t;document.getElementById("mb").innerHTML=b;document.getElementById("m1").classList.add("open");}
function cl(id){document.getElementById(id).classList.remove("open");}
function say(t){document.getElementById("msg").innerText=t;}
function drawInv(){for(let i=0;i<3;i++){let el=document.getElementById("s"+i);el.innerText=inv[i]||"";el.className="slot"+(sel===i?" sel":"");}}
function eq(i){if(!inv[i])return;sel=(sel===i)?-1:i;drawInv();say(sel===i?"Screwdriver equipped! Tap the Air Vent.":"Item unequipped.");}
function bed(){if(!hasTool){hasTool=true;inv.push("🪛");drawInv();pop("🛏️ Under Pillow","You found a rusty <b>Screwdriver 🪛</b>!");say("Picked up Screwdriver!");}else pop("🛏️ Prison Bunk","Nothing else hidden here.");}
function cal(){pop("🗓️ Wall Calendar","Two digits are circled in red:<br><br><b style='font-size:22px;color:#f87171'>19 _ _</b>");say("First two digits: 19...");}
function vent(){if(ventOpen){pop("🕳️ Inside Vent","Scratched in metal:<br><br><b style='font-size:22px;color:#4ade80'>_ _ 42</b>");return;}if(sel===0){ventOpen=true;sel=-1;drawInv();pop("🕳️ Vent Opened!","You pried off the grate!<br><br>Inside you see:<br><b style='font-size:22px;color:#4ade80'>_ _ 42</b>");say("Last two digits: ...42!");}else{pop("🕳️ Air Vent","Screwed tight! Find a tool and tap it in your inventory first.");say("Need a tool to open the vent.");}}
function door(){code="";document.getElementById("dp").innerText="----";document.getElementById("m2").classList.add("open");}
function kp(k){if(k==="C")code="";else if(k==="OK"){if(code==="1942"){cl("m2");pop("🎉 ESCAPED!","The steel door unlocked!<br><br><b>Room 1 Complete!</b>");say("CELL 04 UNLOCKED!");}else{code="";say("❌ Wrong code! Check Calendar & Vent.");}}else if(code.length<4)code+=k;document.getElementById("dp").innerText=code.padEnd(4,"-");}
function hint(){pop("💡 Guard's Tip","1. Tap <b>Bunk</b> for Screwdriver.<br>2. Tap <b>🪛</b> in Inventory.<br>3. Tap <b>Vent</b> to see <b>42</b>.<br>4. Enter <b>1942</b> on the <b>Door</b>.");}
</script>
</body>
</html>
