<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Save Elena: Prison Break</title>
<script src="https://libtl.com/sdk.js" data-zone="12321503" data-sdk="show_12321503"></script>
<style>
  :root{
    --gold:#ffc95a;
    --gold-dim:#c8963e;
    --bg:#07080c;
    --panel:#11151d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    overflow:hidden;position:fixed;
    background:#04050a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#e9edf5;
    user-select:none;-webkit-user-select:none;
  }
  #app{
    position:fixed;inset:0;
    max-width:480px;margin:0 auto;
    display:flex;flex-direction:column;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 0 70px rgba(0,0,0,.85);
  }

  /* ================= HUD ================= */
  #hud{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    gap:6px;
    padding:calc(env(safe-area-inset-top,0px) + 7px) 9px 7px;
    background:linear-gradient(180deg,#131822,#0a0d13);
    border-bottom:1px solid rgba(255,201,90,.2);
    z-index:6;
  }
  .hud-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .room-badge{
    display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,#232b39,#161c26);
    border:1px solid rgba(255,201,90,.45);
    border-radius:9px;padding:2px 9px;line-height:1;
    flex:0 0 auto;
  }
  .rb-label{font-size:7px;letter-spacing:1.4px;color:var(--gold-dim);font-weight:700;}
  .rb-num{font-size:16px;font-weight:800;color:var(--gold);}
  .sector-name{
    font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
    color:#8d99ad;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hud-right{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
  .icon-btn{
    width:33px;height:33px;border-radius:9px;
    background:linear-gradient(180deg,#202836,#141a24);
    border:1px solid #2d3648;color:#dbe3f0;
    font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, background .15s;
  }
  .icon-btn:active{transform:scale(.92);background:#2a3446;}
  .ad-btn{
    height:33px;padding:0 8px;border-radius:9px;
    background:linear-gradient(180deg,#3a2d12,#241a08);
    border:1px solid rgba(255,201,90,.55);
    color:var(--gold);font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:3px;cursor:pointer;
    transition:transform .12s;
  }
  .ad-btn span{font-size:10px;letter-spacing:.4px;}
  .ad-btn:active{transform:scale(.93);}

  /* ================= STAGE ================= */
  #stage{
    position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    background:#07080c;
  }
  #scene{display:block;width:100%;height:100%;}

  /* hotspots */
  .hotspot{cursor:pointer;}
  .hotspot:not(.found):not(.locked-hs){animation:hsPulse 2.6s ease-in-out infinite;}
  .hotspot.found{opacity:.5;animation:none;}
  .hotspot.locked-hs{animation:hsShake 3.2s ease-in-out infinite;}
  @keyframes hsPulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(255,201,90,0));}
    50%{filter:drop-shadow(0 0 8px rgba(255,201,90,.9));}
  }
  @keyframes hsShake{
    0%,88%,100%{filter:drop-shadow(0 0 0 rgba(255,120,80,0));}
    92%,96%{filter:drop-shadow(0 0 9px rgba(255,120,80,.95));}
  }

  /* bars */
  #bars{
    transition:transform 1.55s cubic-bezier(.65,0,.25,1);
    will-change:transform;
  }
  #bars.open{transform:translateY(-620px);}

  /* elena */
  #elena{
    transform-box:fill-box;
    transform-origin:50% 100%;
    transition:transform 1s cubic-bezier(.3,1.4,.5,1);
  }
  #elena.free{transform:translateY(-8px) scale(1.12);}

  #freedomGlow{opacity:0;transition:opacity .9s ease;}
  #freedomGlow.show{opacity:1;}

  /* speech bubble */
  #bubbleWrap{
    position:absolute;left:0;right:0;top:6px;
    display:flex;justify-content:center;
    padding:0 10px;pointer-events:none;z-index:4;
  }
  #bubble{
    position:relative;
    max-width:315px;
    background:rgba(11,14,20,.94);
    border:1.5px solid rgba(255,201,90,.5);
    border-radius:14px;
    padding:8px 13px;
    font-size:12.5px;line-height:1.35;
    color:#f4ead8;text-align:center;
    box-shadow:0 8px 26px rgba(0,0,0,.6);
    backdrop-filter:blur(3px);
  }
  #bubble::after{
    content:'';position:absolute;left:50%;bottom:-8px;
    transform:translateX(-50%);
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:8px solid rgba(255,201,90,.5);
  }
  #bubble::before{
    content:'';position:absolute;left:50%;bottom:-6px;
    transform:translateX(-50%);
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-top:7px solid rgba(11,14,20,.94);
    z-index:1;
  }
  #bubble.pop{animation:bubblePop .34s ease;}
  @keyframes bubblePop{
    0%{transform:scale(.9);opacity:.4;}
    60%{transform:scale(1.03);opacity:1;}
    100%{transform:scale(1);}
  }

  /* clue toast */
  #clueToast{
    position:absolute;left:9px;right:9px;bottom:9px;
    background:rgba(9,11,17,.96);
    border:1px solid rgba(255,201,90,.45);
    border-radius:12px;
    padding:9px 12px;
    font-size:12px;line-height:1.4;color:#f2e7d3;
    opacity:0;transform:translateY(14px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;z-index:4;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #clueToast.show{opacity:1;transform:translateY(0);}
  #clueToast b{color:var(--gold);font-size:15px;}

  /* alarm flash */
  #alarmFlash{
    position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;
    background:radial-gradient(circle at 50% 50%,rgba(255,40,40,0) 25%,rgba(255,30,30,.6) 100%);
  }
  #alarmFlash.show{animation:alarmPulse .65s ease;}
  @keyframes alarmPulse{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

  /* ================= DOCK ================= */
  #dock{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
    background:linear-gradient(0deg,#131822,#0a0d13);
    border-top:1px solid rgba(255,201,90,.2);
    z-index:6;
  }
  .dock-label{
    font-size:8px;letter-spacing:1.3px;color:#6f7b8e;
    font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);
    flex:0 0 auto;
  }
  .digits{display:flex;gap:5px;flex:1 1 auto;justify-content:center;}
  .slot{
    width:32px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:#151b25;border:1.5px solid #2c3546;
    font-size:16px;font-weight:800;color:#5d6879;
    transition:all .25s ease;
  }
  .slot.on{
    background:linear-gradient(180deg,#2a2311,#1a1509);
    border-color:rgba(255,201,90,.8);
    color:var(--gold);
    box-shadow:0 0 14px rgba(255,201,90,.35);
  }
  #toolSlot{
    width:38px;height:38px;border-radius:10px;
    background:#141b26;border:1.5px dashed #2c3546;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer;flex:0 0 auto;
    transition:all .2s ease;position:relative;
  }
  #toolSlot.empty{opacity:.45;font-size:13px;color:#4d5668;}
  #toolSlot.equipped{
    border-style:solid;
    border-color:var(--gold);
    background:linear-gradient(180deg,#2a2311,#1a1509);
    box-shadow:0 0 16px rgba(255,201,90,.55);
    animation:toolGlow 1.6s ease-in-out infinite;
  }
  @keyframes toolGlow{
    0%,100%{box-shadow:0 0 10px rgba(255,201,90,.4);}
    50%{box-shadow:0 0 20px rgba(255,201,90,.9);}
  }
  #toolSlot .badge{
    position:absolute;top:-4px;right:-4px;
    width:14px;height:14px;border-radius:50%;
    background:var(--gold);color:#1a1509;
    font-size:9px;font-weight:900;
    display:none;align-items:center;justify-content:center;
  }
  #toolSlot.equipped .badge{display:flex;}
  #openKeypadBtn{
    flex:0 0 auto;
    height:38px;padding:0 12px;border-radius:10px;
    background:linear-gradient(180deg,#2b3547,#1a212d);
    border:1px solid #3b465c;color:#dbe3f0;
    font-size:16px;cursor:pointer;transition:transform .12s;
  }
  #openKeypadBtn:active{transform:scale(.94);}

  /* ================= MODALS ================= */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:14px;
    background:rgba(3,4,8,.86);
    backdrop-filter:blur(5px);
  }
  .modal.show{display:flex;}
  .modal-card{
    width:100%;max-width:350px;max-height:88vh;
    display:flex;flex-direction:column;
    background:linear-gradient(165deg,#161c26,#0a0d13);
    border:1px solid rgba(255,201,90,.3);
    border-radius:18px;
    padding:15px;
    box-shadow:0 24px 70px rgba(0,0,0,.8);
    animation:cardIn .26s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes cardIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-title{
    font-size:15px;font-weight:800;letter-spacing:.6px;
    color:var(--gold);text-align:center;margin:0 0 12px;
    text-transform:uppercase;
  }

  /* keypad */
  .code-display{
    display:flex;gap:8px;justify-content:center;margin-bottom:14px;
  }
  .cd-box{
    width:46px;height:52px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:#0a0e14;border:1.5px solid #2c3546;
    font-size:23px;font-weight:800;color:#4b5668;
    font-family:monospace;
    transition:all .18s;
  }
  .cd-box.filled{
    border-color:rgba(255,201,90,.85);
    color:var(--gold);
    box-shadow:0 0 16px rgba(255,201,90,.3) inset;
  }
  .code-display.shake{animation:shakeX .4s ease;}
  @keyframes shakeX{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px;}
  .key{
    height:48px;border-radius:11px;
    background:linear-gradient(180deg,#232c3b,#161d28);
    border:1px solid #333d4f;
    color:#e6ecf6;font-size:19px;font-weight:700;
    cursor:pointer;transition:transform .09s, background .12s;
  }
  .key:active{transform:scale(.93);background:#313c50;}
  .key-ok{background:linear-gradient(180deg,#1d5133,#123322);border-color:#2f8a56;color:#7dffb0;}
  .key-fn{background:linear-gradient(180deg,#4a2323,#2a1212);border-color:#7c3a3a;color:#ff9d9d;}

  /* buttons */
  .btn{
    width:100%;height:44px;border-radius:12px;
    font-size:14px;font-weight:800;letter-spacing:.4px;
    cursor:pointer;transition:transform .12s, filter .15s;
    margin-top:8px;border:none;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{
    background:linear-gradient(180deg,#ffd97a,#d99e2b);
    color:#221a05;
    box-shadow:0 6px 20px rgba(255,201,90,.3);
  }
  .btn-ghost{
    background:transparent;color:#93a0b5;
    border:1px solid #2f3a4c;
  }

  /* map */
  .map-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
    overflow-y:auto;flex:1 1 auto;min-height:0;
    padding:2px 4px 2px 2px;
    -webkit-overflow-scrolling:touch;
  }
  .map-cell{
    background:linear-gradient(180deg,#1b222e,#11161f);
    border:1px solid #2a3342;
    border-radius:9px;
    padding:5px 2px 4px;
    display:flex;flex-direction:column;align-items:center;
    color:#cdd5e2;cursor:pointer;
    transition:transform .1s, border-color .15s;
  }
  .map-cell:active{transform:scale(.93);}
  .map-cell.locked{opacity:.32;cursor:not-allowed;}
  .map-cell.done{border-color:rgba(255,201,90,.55);background:linear-gradient(180deg,#232b1c,#151a10);}
  .map-cell.current{border-color:#6fa8ff;box-shadow:0 0 12px rgba(111,168,255,.45);}
  .mc-num{font-size:12px;font-weight:800;line-height:1.1;}
  .mc-stars{font-size:8px;letter-spacing:-1px;line-height:1;margin-top:2px;}

  /* win */
  .win-title{
    font-size:23px;font-weight:900;letter-spacing:1.5px;
    text-align:center;color:var(--gold);
    text-shadow:0 0 26px rgba(255,201,90,.55);
    margin-bottom:6px;
  }
  .win-stars{
    text-align:center;font-size:33px;letter-spacing:5px;
    margin:4px 0 8px;
    filter:drop-shadow(0 0 12px rgba(255,201,90,.65));
    animation:starPop .6s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes starPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .win-sub{text-align:center;font-size:12px;color:#8d99ad;font-weight:700;letter-spacing:.6px;margin-bottom:10px;}
  .win-quote{
    text-align:center;font-size:13px;line-height:1.45;
    color:#f2e7d3;font-style:italic;
    background:rgba(255,201,90,.07);
    border:1px solid rgba(255,201,90,.22);
    border-radius:12px;padding:10px 12px;margin-bottom:6px;
  }

  /* ad */
  .ad-box{
    text-align:center;padding:22px 10px;
  }
  .ad-label{
    font-size:10px;letter-spacing:2px;color:#6f7b8e;
    font-weight:800;text-transform:uppercase;margin-bottom:14px;
  }
  .ad-visual{
    height:110px;border-radius:12px;
    background:repeating-linear-gradient(45deg,#151b25,#151b25 12px,#1b2230 12px,#1b2230 24px);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;margin-bottom:14px;
    border:1px solid #2a3342;
  }
  .ad-count{
    font-size:30px;font-weight:900;color:var(--gold);
    font-family:monospace;
  }
  .ad-sub{font-size:11px;color:#6f7b8e;margin-top:4px;}

  .hidden{display:none !important;}

  /* tool toast */
  #toolToast{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.6);
    background:rgba(9,11,17,.96);
    border:1.5px solid var(--gold);
    border-radius:14px;
    padding:12px 18px;
    font-size:13px;color:#f2e7d3;
    opacity:0;pointer-events:none;z-index:7;
    transition:all .35s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 34px rgba(255,201,90,.55);
    text-align:center;font-weight:700;
  }
  #toolToast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #toolToast .ti{font-size:26px;display:block;margin-bottom:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ HUD ============ -->
  <header id="hud">
    <div class="hud-left">
      <div class="room-badge">
        <span class="rb-label">ROOM</span>
        <span class="rb-num" id="roomNum">1</span>
      </div>
      <div class="sector-name" id="sectorName">Rusted Halls</div>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
      <button class="icon-btn" id="mapBtn" aria-label="Level map">🗺️</button>
      <button class="ad-btn" id="hintBtn">💡<span>Hint</span></button>
      <button class="ad-btn" id="skipBtn">⏭️<span>Skip</span></button>
    </div>
  </header>

  <!-- ============ STAGE ============ -->
  <main id="stage">
    <svg id="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="wallStop1" offset="0%" stop-color="#33261a"/>
          <stop id="wallStop2" offset="100%" stop-color="#100b07"/>
        </linearGradient>
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="floorStop1" offset="0%" stop-color="#241a12"/>
          <stop id="floorStop2" offset="100%" stop-color="#0a0604"/>
        </linearGradient>
        <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#333941"/>
          <stop offset="38%" stop-color="#b4bdc9"/>
          <stop offset="62%" stop-color="#5b636e"/>
          <stop offset="100%" stop-color="#1e2228"/>
        </linearGradient>
        <radialGradient id="lampGlow" cx="50%" cy="0%" r="85%">
          <stop offset="0%" stop-color="rgba(255,220,160,0.30)"/>
          <stop offset="55%" stop-color="rgba(255,220,160,0.06)"/>
          <stop offset="100%" stop-color="rgba(255,220,160,0)"/>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
          <stop offset="52%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.74)"/>
        </radialGradient>
        <radialGradient id="freedomGlowGrad" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="rgba(255,245,200,0.95)"/>
          <stop offset="60%" stop-color="rgba(255,220,140,0.35)"/>
          <stop offset="100%" stop-color="rgba(255,220,140,0)"/>
        </radialGradient>
      </defs>

      <!-- WALL -->
      <rect x="0" y="0" width="400" height="445" fill="url(#wallGrad)"/>
      <g stroke="rgba(0,0,0,0.22)" stroke-width="1.2">
        <line x1="0" y1="64" x2="400" y2="64"/>
        <line x1="0" y1="138" x2="400" y2="138"/>
        <line x1="0" y1="212" x2="400" y2="212"/>
        <line x1="0" y1="286" x2="400" y2="286"/>
        <line x1="0" y1="360" x2="400" y2="360"/>
      </g>
      <g stroke="rgba(0,0,0,0.16)" stroke-width="1.2">
        <line x1="70" y1="0" x2="70" y2="64"/>
        <line x1="200" y1="0" x2="200" y2="64"/>
        <line x1="320" y1="0" x2="320" y2="64"/>
        <line x1="140" y1="64" x2="140" y2="138"/>
        <line x1="290" y1="64" x2="290" y2="138"/>
        <line x1="60" y1="138" x2="60" y2="212"/>
        <line x1="220" y1="138" x2="220" y2="212"/>
        <line x1="350" y1="138" x2="350" y2="212"/>
        <line x1="110" y1="212" x2="110" y2="286"/>
        <line x1="270" y1="212" x2="270" y2="286"/>
        <line x1="30" y1="286" x2="30" y2="360"/>
        <line x1="170" y1="286" x2="170" y2="360"/>
        <line x1="330" y1="286" x2="330" y2="360"/>
        <line x1="90" y1="360" x2="90" y2="445"/>
        <line x1="240" y1="360" x2="240" y2="445"/>
      </g>

      <!-- FLOOR -->
      <rect x="0" y="445" width="400" height="115" fill="url(#floorGrad)"/>
      <line x1="0" y1="445" x2="400" y2="445" stroke="rgba(255,255,255,0.07)" stroke-width="2.5"/>
      <g stroke="rgba(255,255,255,0.045)" stroke-width="1.2">
        <line x1="0" y1="482" x2="400" y2="482"/>
        <line x1="0" y1="524" x2="400" y2="524"/>
        <line x1="110" y1="445" x2="70" y2="560"/>
        <line x1="200" y1="445" x2="200" y2="560"/>
        <line x1="290" y1="445" x2="330" y2="560"/>
      </g>

      <!-- LAMP WASH -->
      <rect x="0" y="0" width="400" height="560" fill="url(#lampGlow)" pointer-events="none"/>

      <!-- ============ HOTSPOT: POSTER ============ -->
      <g class="hotspot" data-hot="poster" id="hsPoster">
        <rect x="44" y="150" width="72" height="96" rx="3" fill="#cbbd9d"/>
        <rect x="44" y="150" width="72" height="96" rx="3" fill="none" stroke="#7a6a4a" stroke-width="2"/>
        <rect x="52" y="160" width="56" height="9" rx="2" fill="#8a7a58" opacity="0.5"/>
        <rect x="52" y="176" width="42" height="6" rx="2" fill="#8a7a58" opacity="0.4"/>
        <rect x="52" y="188" width="50" height="6" rx="2" fill="#8a7a58" opacity="0.4"/>
        <circle cx="80" cy="217" r="14" fill="#b0a184" opacity="0.55"/>
        <path d="M44 246 L116 226 L116 246 Z" fill="#000" opacity="0.16"/>

<script>
document.addEventListener('DOMContentLoaded', function () {

  function clampInt(v, lo, hi) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = lo;
    return Math.max(lo, Math.min(hi, v));
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    ctx: null,
    master: null,
    muted: false,
    init: function () {
      if (!this.ctx) {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.55;
          this.master.connect(this.ctx.destination);
        } catch (e) { this.ctx = null; }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(function () {});
      }
    },
    tone: function (freq, dur, type, vol, delay, endFreq) {
      if (!this.ctx || this.muted) return;
      try {
        var t0 = this.ctx.currentTime + (delay || 0);
        var o = this.ctx.createOscillator();
        var g = this.ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t0);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.15), t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(this.master);
        o.start(t0); o.stop(t0 + dur + 0.06);
      } catch (e) {}
    },
    noise: function (dur, vol, delay, filterFreq) {
      if (!this.ctx || this.muted) return;
      try {
        var t0 = this.ctx.currentTime + (delay || 0);
        var len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
        var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        var src = this.ctx.createBufferSource();
        src.buffer = buf;
        var f = this.ctx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = filterFreq || 1200;
        f.Q.value = 1.1;
        var g = this.ctx.createGain();
        g.gain.value = vol || 0.2;
        src.connect(f); f.connect(g); g.connect(this.master);
        src.start(t0);

    pickup: function () {

  /* Room-config generator: rotates lock types so every room is fresh */
  function genRoom(n) {

    /*

       4 — Poster(free) + Mirror(rag) + Mattress(free)         → digits: 0,1,2,3
       5 — Mattress(free) + Vent(screwdriver) + Box(key)       → digits: 0,1,2,3

    */

        lockedSpot = 'box';
        toolSpot = 'mattress';
        requiredTool = 'key';

        lockedSpot = 'brick';
        toolSpot = 'mattress';
        requiredTool = 'crowbar';
        break;
      case 3:
        // Poster has tool, Dark is locked, Mattress is free
        freeSpots = ['mattress'];
        lockedSpot = 'dark';
        toolSpot = 'poster';
        requiredTool = 'flashlight';
        break;
      case 4:
        // Mattress has tool, Mirror is locked, Poster is free
        freeSpots = ['poster'];
        lockedSpot = 'mirror';
        toolSpot = 'mattress';
        requiredTool = 'rag';
        break;
      case 5:
        // Poster has tool, Vent is locked, Mattress is free
        freeSpots = ['mattress'];
        lockedSpot = 'vent';
        toolSpot = 'poster';
        requiredTool = 'screwdriver';
        break;
      case 6:
        // Mattress has tool, Brick is locked, Poster is free
        freeSpots = ['poster'];
        lockedSpot = 'brick';
        toolSpot = 'mattress';
        requiredTool = 'hammer';
        break;
      default:
        freeSpots = ['poster'];
        lockedSpot = 'vent';
        toolSpot = 'mattress';
        requiredTool = 'screwdriver';
    }

    // Tool holding spot gets the tool AND a free clue? 
    // No — tool spot gives tool only. Free spots give clues directly.
    // We need exactly 4 digits revealed across: freeSpots clues + lockedSpot clue.

    // Determine which digits each spot reveals
    // freeSpots[0] → 1 digit, lockedSpot → 3 digits? That's 4 total.
    // Wait, we want at least 1-2 locked spots. Let's make it:
    //   freeSpots each reveal 1 digit  (1 or 2 free spots)
    //   lockedSpot reveals remaining 2-3 digits

    var freeSpotList = freeSpots.slice();
    // ensure at least 1 free spot
    if (freeSpotList.length === 0) freeSpotList.push('mattress');

    // Assign digits to spots
    var digitAssignments = {};
    var digitIdx = 0;

    // free spots get 1 digit each
    for (var i = 0; i < freeSpotList.length; i++) {
      digitAssignments[freeSpotList[i]] = [digitIdx];
      digitIdx++;
    }

    // locked spot gets remaining digits
    var remainingDigits = [];
    while (digitIdx < 4) {
      remainingDigits.push(digitIdx);
      digitIdx++;
    }
    digitAssignments[lockedSpot] = remainingDigits;

    // tool spot reveals tool only (no clue)
    // But if tool spot === a free spot? In our archetypes, toolSpot and freeSpots are disjoint.
    // Verify: case 0 tool=mattress free=poster lock=vent. OK.

    // Build clue text for each spot
    var clueTexts = {};

    function buildClue(spot, digitIndices) {
      var templates = CLUE_TEMPLATES[spot];
      if (!templates) templates = ['You find something: <b>{digits}</b>'];
      var tpl = templates[Math.floor(rnd() * templates.length)];
      var map = {};
      for (var j = 0; j < digitIndices.length; j++) {
        var idx = digitIndices[j];
        map['{d' + idx + '}'] = digits[idx];
      }
      // handle {digits} placeholder
      var digitsStr = '';
      for (var k = 0; k < digitIndices.length; k++) {
        digitsStr += digits[digitIndices[k]];
      }
      map['{digits}'] = digitsStr;

      var out = tpl;
      for (var key in map) {
        if (Object.prototype.hasOwnProperty.call(map, key)) {
          out = out.split(key).join(map[key]);
        }
      }
      return out;
    }

    for (var spot in digitAssignments) {
      if (Object.prototype.hasOwnProperty.call(digitAssignments, spot)) {
        clueTexts[spot] = buildClue(spot, digitAssignments[spot]);
      }
    }

    return {
      n: n,
      digits: digits,
      code: digits.join(''),
      sector: sector,
      theme: theme,
      archetype: archetype,
      freeSpots: freeSpotList,
      lockedSpot: lockedSpot,
      toolSpot: toolSpot,
      requiredTool: requiredTool,
      clueTexts: clueTexts,
      digitAssignments: digitAssignments,
      revealed: {},      // spot -> true when clue revealed
      toolCollected: false,
      lockOpened: false
    };
  }

  /* =========================================================
     STATE
     ========================================================= */
  var SAVE_KEY = 'saveElena_v2';
  var state = {
    current: 1,
    maxUnlocked: 1,
    stars: {},
    muted: false
  };

  var room = null;
  var found = [false, false, false, false];
  var entry = '';

  var adTimer = null;

  var collectedTools = [];

  /* =========================================================
     SAVE / LOAD
     ========================================================= */
  function saveState() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        current: state.current,
        maxUnlocked: state.maxUnlocked,
        stars: state.stars,
        muted: state.muted
      }));
    } catch (e) {}
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        // migrate from v1
        raw = localStorage.getItem('saveElena_v1');
      }
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return;
      state.current = clampInt(s.current, 1, 100);
      state.maxUnlocked = clampInt(s.maxUnlocked, 1, 100);
      state.stars = (s.stars && typeof s.stars === 'object') ? s.stars : {};
      state.muted = !!s.muted;
    } catch (e) {}
  }

  /* ---- expressions ---- */
  var EXPR = {

      mo.setAttribute('stroke', '#a34b4b');
    }

    if (exprTimer) { clearTimeout(exprTimer); exprTimer = null; }
    if (revertMs && name !== 'worried') {

    var slots = document.querySelectorAll('#digitSlots .slot');

  /* ---- tool slot ---- */
  function renderToolSlot() {
    var slot = $('toolSlot');

      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '✓';
      slot.appendChild(badge);
    }

    if (collectedTools.length === 0) {
      slot.className = 'empty';
      slot.innerHTML = '—';
      var b = document.createElement('span');
      b.className = 'badge';
      b.textContent = '✓';
      slot.appendChild(b);
    } else {
      var tool = collectedTools[0];
      var t = TOOLS[tool];
      if (equippedTool === tool) {
        slot.className = 'equipped';
      } else {
        slot.className = '';
      }
      slot.innerHTML = t.emoji;
      var badge2 = document.createElement('span');
      badge2.className = 'badge';
      badge2.textContent = '✓';

  /* ---- keypad entry ---- */
  function renderEntry() {
    var boxes = document.querySelectorAll('#codeDisplay .cd-box');

        // dark corner: handled by dimming? We'll add a dark overlay via CSS
        // For simplicity, no overlay — Elena hints it's dark
      }

  /* =========================================================
     ROOM LOADING
     ========================================================= */
  function loadRoom(n) {
    room = genRoom(n);
    found = [false, false, false, false];
    entry = '';
    mistakes = 0;
    hintsUsed = 0;
    solved = false;
    equippedTool = null;
    collectedTools = [];

    resetScene();
    applyTheme(room.theme);
    applyHotspotVisuals();

    $('roomNum').textContent = String(n);
    $('sectorName').textContent = room.theme.name;

    renderDigits();
    renderEntry();
    renderToolSlot();
    closeModal('keypadModal');

    setExpression('worried');

    // Opening line contextual to archetype
    var lockInfo = LOCKS[room.lockedSpot];
    var toolInfo = TOOLS[room.requiredTool];
    var openers = [
      'The keypad needs 4 digits. But something in here is ' + (lockInfo ? lockInfo.label.toLowerCase() : 'locked') + '... I bet a ' + (toolInfo ? toolInfo.name.toLowerCase() : 'tool') + ' is hidden nearby.',
      'We need the code — but that ' + (lockInfo ? lockInfo.label.toLowerCase() : 'thing') + ' is ' + (room.lockedSpot === 'vent' ? 'screwed shut' : room.lockedSpot === 'box' ? 'locked tight' : room.lockedSpot === 'mirror' ? 'covered in grime' : room.lockedSpot === 'dark' ? 'pitch black' : 'stuck') + '. Find a tool first!',
      'Search the cell. Collect a tool, then use it on the ' + (lockInfo ? lockInfo.label.toLowerCase() : 'blocked spot') + ' to reveal the numbers.'
    ];
    say(pick(openers));
  }

  /* =========================================================
     TOOL PICKUP & LOCK INTERACTION
     ========================================================= */
  function collectTool(toolKey) {
    if (room.toolCollected) return;
    room.toolCollected = true;
    collectedTools = [toolKey];
    showToolToast(toolKey);
    Sound.pickup();
    setExpression('hopeful', 2200);
    say('A ' + TOOLS[toolKey].name + '! ' + (room.lockedSpot === 'vent' ? 'Use it on the vent grate!' : room.lockedSpot === 'box' ? 'Use it on the wooden box!' : room.lockedSpot === 'mirror' ? 'Wipe the mirror with it!' : room.lockedSpot === 'dark' ? 'Shine it in the dark corner!' : 'Use it on the loose brick!'));
    renderToolSlot();
  }

  function equipTool() {
    if (collectedTools.length === 0) return;
    var tool = collectedTools[0];
    if (equippedTool === tool) {
      // unequip
      equippedTool = null;
      say('Unequipped the ' + TOOLS[tool].name + '.');
    } else {
      equippedTool = tool;
      Sound.beep();
      say(TOOLS[tool].name + ' equipped! Now tap the ' + LOCKS[room.lockedSpot].label + '.');
    }
    renderToolSlot();
  }

  function tryUnlockLockedSpot() {
    if (!room.lockedSpot) return;
    if (room.lockOpened) {
      // already opened — reveal clue if not already
      revealLockedClue();
      return;
      }

    if (equippedTool === null) {
      // check if they have the right tool but didn't equip
      if (collectedTools.length > 0) {
        say('Tap your tool in the bottom bar to equip it first!');
      } else {
        say(LOCKS[room.lockedSpot].hint);
      }
      setExpression('worried', 1600);
      return;
    }

    var lockDef = LOCKS[room.lockedSpot];
    var toolDef = TOOLS[equippedTool];

    if (lockDef.tools.indexOf(equippedTool) === -1) {
      // wrong tool
      Sound.error();
      setExpression('panicked', 1800);
      say('That ' + toolDef.name + ' will not work here. ' + lockDef.hint);
      return;
    }

    // Correct tool — unlock!
    room.lockOpened = true;
    room.revealed[room.lockedSpot] = true;

    // Remove lock visual
    var lockNode = document.querySelector('.hotspot[data-hot="' + room.lockedSpot + '"]');
    if (lockNode) {
      lockNode.classList.remove('locked-hs');
      lockNode.classList.add('found');
    }

    // Animate specific unlock
    if (room.lockedSpot === 'vent') {
      var vs = $('ventScrews');
      if (vs) vs.setAttribute('opacity', '0');
      Sound.unlock();
    } else if (room.lockedSpot === 'mirror') {
      var pg = $('posterGrime');
      if (pg) {
        pg.style.transition = 'opacity 0.8s ease';
        pg.setAttribute('opacity', '0');
      }
      Sound.wipe();
    } else if (room.lockedSpot === 'box') {
      Sound.unlock();
    } else if (room.lockedSpot === 'brick') {
      Sound.noise(0.4, 0.22, 0, 500);
      Sound.tone(140, 0.3, 'sawtooth', 0.12);
    } else if (room.lockedSpot === 'dark') {
      Sound.tone(440, 0.2, 'sine', 0.1);
    }

    setExpression('hopeful', 2500);
    say('The ' + lockDef.label + ' opens! Look at the numbers!');

    // Mark digits found
    var assigned = room.digitAssignments[room.lockedSpot] || [];
    for (var i = 0; i < assigned.length; i++) {
      found[assigned[i]] = true;
    }
    renderDigits();

    showToast(room.clueTexts[room.lockedSpot]);
  }

  function revealLockedClue() {
    var assigned = room.digitAssignments[room.lockedSpot] || [];
    for (var i = 0; i < assigned.length; i++) {
      found[assigned[i]] = true;
    }
    renderDigits();
    showToast(room.clueTexts[room.lockedSpot]);
  }

  /* =========================================================
     HOTSPOT INTERACTION
     ========================================================= */
  function onHotspot(hot) {
    if (!room || solved) return;

    if (hot === 'keypad') {
      openKeypad();
      return;
    }

    // If it's the locked spot
    if (hot === room.lockedSpot) {
      tryUnlockLockedSpot();
      return;
    }

    // If it's the tool spot and tool not yet collected
    if (hot === room.toolSpot && !room.toolCollected) {
      collectTool(room.requiredTool);
      // Tool spot may ALSO be a free spot? In our archetypes, toolSpot is always
      // disjoint from freeSpots. But just in case:
      if (room.digitAssignments[hot] && !room.revealed[hot]) {
        room.revealed[hot] = true;
        var assigned = room.digitAssignments[hot];
        for (var i = 0; i < assigned.length; i++) found[assigned[i]] = true;
        renderDigits();
        showToast(room.clueTexts[hot]);
      }
      var node = document.querySelector('.hotspot[data-hot="' + hot + '"]');
      if (node) node.classList.add('found');
      return;
    }

    // If it's a free spot
    if (room.freeSpots.indexOf(hot) !== -1) {
      if (room.revealed[hot]) {
        setExpression('worried', 1500);
        say('I already checked there…');
        return;
      }
      room.revealed[hot] = true;
      var assignedF = room.digitAssignments[hot] || [];
      for (var j = 0; j < assignedF.length; j++) found[assignedF[j]] = true;
      renderDigits();
      Sound.pickup();
      setExpression('hopeful', 2400);
      say(pick([
        "Yes! That's one of the numbers!",
        'Keep going — we are close!',
        'I knew you would find it!',
        'Perfect! Remember it!'
      ]));
      showToast(room.clueTexts[hot]);
      var nodeF = document.querySelector('.hotspot[data-hot="' + hot + '"]');
      if (nodeF) nodeF.classList.add('found');
      return;
    }

    // Tool spot already collected, or non-free/non-locked spot
    // If tool spot already collected and has a clue
    if (hot === room.toolSpot && room.toolCollected) {
      if (room.digitAssignments[hot] && !room.revealed[hot]) {
        room.revealed[hot] = true;
        var assignedT = room.digitAssignments[hot];
        for (var k = 0; k < assignedT.length; k++) found[assignedT[k]] = true;
        renderDigits();
        showToast(room.clueTexts[hot]);
        Sound.pickup();
        return;
      }
      setExpression('worried', 1500);
      say('I already searched there.');
      return;
    }

    // Fallback idle
    var now = Date.now();
    if (now - lastIdle > 2600) {
      lastIdle = now;
      setExpression('worried', 1600);
      say('Look around — there must be a tool and a clue hidden somewhere!');
    }
  }

  function openKeypad() {
    if (!room || solved) return;
    Sound.beep();
    entry = '';
    renderEntry();
    openModal('keypadModal');
    setExpression('worried');
  }

  function pressKey(k) {
    if (solved) return;
    Sound.beep();

    if (k === 'C') {
      entry = '';
      renderEntry();
      return;
    }
    if (k === 'OK') {
      submitCode();
      return;
    }
    if (entry.length < 4) {
      entry += k;
      renderEntry();
    }
  }

  function submitCode() {
    if (!room || solved) return;

    if (entry.length < 4) {
      say('I need all four numbers first!');
      Sound.error();
      return;
    }

    if (entry === room.code) {
      solved = true;
      closeModal('keypadModal');
      winRoom();
    } else {
      mistakes++;
      Sound.error();
      shakeDisplay();
      flashAlarm();
      setExpression('panicked', 2000);
      say(pick([
        "No! That's wrong — the alarm will wake the guards!",
        'Wait, wait — that is not it. Try again!',
        'Shhh! That was not the code!',
        'The light flashed red… please be careful!'
      ]));
      entry = '';
      renderEntry();
    }
  }

  /* =========================================================
     WIN SEQUENCE
     ========================================================= */
  function winRoom() {
    var n = state.current;
    var earned = Math.max(1, 3 - mistakes - hintsUsed);

    if (!state.stars[n] || state.stars[n] < earned) state.stars[n] = earned;
    state.maxUnlocked = Math.max(state.maxUnlocked, Math.min(100, n + 1));
    saveState();

    setExpression('happy');
    say('The lock clicked! You did it! Pull the door!');
    Sound.rattle();

    setTimeout(function () {
      $('bars').classList.add('open');
      $('freedomGlow').classList.add('show');
      Sound.barsOpen();

      setTimeout(function () {
        $('elena').classList.add('free');
        Sound.footstep();

        setTimeout(function () {
          Sound.fanfare();
          showWin(earned);
        }, 720);
      }, 900);
    }, 700);
  }

  function showWin(earned) {
    var n = state.current;

    $('winStars').textContent = '⭐'.repeat(earned) + '☆'.repeat(3 - earned);
    $('winSub').textContent = (n >= 100) ? 'All 100 rooms cleared!' : ('Room ' + n + ' cleared');

    if (n >= 100) {
      $('winQuote').textContent = '“We did it… we are finally free. Thank you, truly.”';
      $('nextBtn').textContent = '🏁 Finish';
      say('We did it… we are free!');
    } else {
      $('winQuote').textContent = '“Thank you! Let\'s move to the next room!”';
      $('nextBtn').textContent = 'Next Room →';
      say("Thank you! Let's move to the next room!");
    }

    openModal('winModal');
  }

  /* =========================================================
     ADVANCE / ADS
     ========================================================= */
  function goNextRoom() {
    if (state.current >= 100) {
      renderMap();
      openModal('mapModal');
      return;
    }

    var target = state.current + 1;

    function advance() {
      state.current = target;
      saveState();
      loadRoom(target);
    }

    if (state.current >= 5) {
      showInterstitialAd(advance);
    } else {
      advance();
    }
  }

  /* ---- simulated ad player ---- */
  function playAd(seconds, label, onDone) {
    var modal = $('adModal');
    var countEl = $('adCount');
    var labelEl = $('adLabel');
    var btn = $('adCloseBtn');

    labelEl.textContent = label;
    btn.classList.add('hidden');
    btn.textContent = (label === 'Interstitial Ad') ? 'Continue' : 'Claim Reward';

    var left = seconds;
    countEl.textContent = String(left);
    openModal('adModal');

    if (adTimer) { clearInterval(adTimer); adTimer = null; }

    adTimer = setInterval(function () {
      left--;
      countEl.textContent = String(Math.max(0, left));
      if (left <= 0) {
        clearInterval(adTimer);
        adTimer = null;
        btn.classList.remove('hidden');
      }
    }, 1000);

    adCallback = onDone || null;

    btn.onclick = function () {
      if (!btn.classList.contains('hidden')) {
        btn.classList.add('hidden');
        closeModal('adModal');
        var cb = adCallback;
        adCallback = null;
        if (cb) cb();
      }
    };
  }

  /* =================== AD HOOKS — MONETAG =================== */
  function showRewardedAdHint() {
    if (typeof window.show_12321503 === 'function') {
      window.show_12321503().then(function () {
        applyHint();
      }).catch(function () {
        applyHint(); // graceful fallback
      });
    } else {
      // Fallback simulated ad
      playAd(3, 'Rewarded Ad', function () { applyHint(); });
    }
  }

  function showRewardedAdSkip() {
    if (typeof window.show_12321503 === 'function') {
      window.show_12321503().then(function () {
        doSkip();
      }).catch(function () {
        doSkip(); // graceful fallback
      });
    } else {
      playAd(3, 'Rewarded Ad', function () { doSkip(); });
    }
  }

  function showInterstitialAd(callback) {
    if (typeof window.show_12321503 === 'function') {
      window.show_12321503().then(function () {
        if (callback) callback();
      }).catch(function () {
        if (callback) callback(); // graceful fallback
      });
    } else {
      playAd(3, 'Interstitial Ad', callback);
    }
  }
  /* ======================================================= */

  function applyHint() {
    if (!room || solved) return;
    hintsUsed++;

    // Find first unrevealed digit
    var missing = [];
    for (var i = 0; i < 4; i++) if (!found[i]) missing.push(i);

    if (missing.length === 0) {
      say('You already have all four numbers! Use the keypad!');
      setExpression('hopeful', 1800);
      Sound.pickup();
      return;
    }

    var idx = missing[0];
    found[idx] = true;
    renderDigits();
    Sound.pickup();
    setExpression('hopeful', 2200);
    say('The guard muttered it once… I think that is one of the numbers!');
    showToast('Hint revealed: digit ' + (idx + 1) + ' is <b>' + room.digits[idx] + '</b>.');
  }

  function doSkip() {
    if (!room || solved) return;
    solved = true;

    var n = state.current;
    if (!state.stars[n]) state.stars[n] = 1;
    state.maxUnlocked = Math.max(state.maxUnlocked, Math.min(100, n + 1));
    saveState();

    setExpression('hopeful');
    say('Okay… we slipped out the back way. Let us not do that again.');
    Sound.fanfare();
    $('bars').classList.add('open');
    $('freedomGlow').classList.add('show');

    setTimeout(function () {
      goNextRoom();
    }, 1250);
  }

  /* =========================================================
     MAP
     ========================================================= */
  function renderMap() {
    var grid = $('mapGrid');
    if (!grid) return;

    var html = '';
    for (var i = 1; i <= 100; i++) {
      var s = state.stars[i] || 0;
      var locked = i > state.maxUnlocked;
      var cls = 'map-cell';
      if (locked) cls += ' locked';
      if (s > 0) cls += ' done';
      if (i === state.current) cls += ' current';

      var stars = locked ? '🔒' : ('⭐'.repeat(s) + '☆'.repeat(3 - s));

      html += '<button class="' + cls + '" data-room="' + i + '"' +
              (locked ? ' disabled' : '') + '>' +
              '<span class="mc-num">' + i + '</span>' +
              '<span class="mc-stars">' + stars + '</span>' +
              '</button>';
    }
    grid.innerHTML = html;

    setTimeout(function () {
      var cur = grid.querySelector('.map-cell.current');
      if (cur && cur.scrollIntoView) {
        try { cur.scrollIntoView({ block: 'center' }); } catch (e) {}
      }
    }, 40);
  }

  /* =========================================================
     SHARE
     ========================================================= */
  function shareRescue() {
    var n = state.current;
    var text = 'I just freed Elena from Room ' + n +
               ' of Save Elena: Prison Break! Can you unlock all 100 prison rooms? 🔓';
    var shareUrl = 'https://t.me/share/url?url=' +
                   encodeURIComponent('https://t.me/share/url') +
                   '&text=' + encodeURIComponent(text);

    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(shareUrl);
        return;
      }
    } catch (e) {}
    window.open(shareUrl, '_blank');
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  function bindEvents() {
    /* --- audio unlock --- */
    function unlock() {
      Sound.init();
      document.removeEventListener('pointerdown', unlock);
      document.removeEventListener('keydown', unlock);
    }
    document.addEventListener('pointerdown', unlock);
    document.addEventListener('keydown', unlock);

    /* --- mute --- */
    $('muteBtn').addEventListener('click', function () {
      Sound.init();
      Sound.muted = !Sound.muted;
      state.muted = Sound.muted;
      saveState();
      this.textContent = Sound.muted ? '🔇' : '🔊';
      if (!Sound.muted) Sound.beep();
    });

    /* --- map --- */
    $('mapBtn').addEventListener('click', function () {
      Sound.init();
      Sound.beep();
      renderMap();
      openModal('mapModal');
    });
    $('mapClose').addEventListener('click', function () {
      closeModal('mapModal');
    });

    $('mapGrid').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.map-cell') : null;
      if (!btn || btn.disabled) return;
      var n = parseInt(btn.getAttribute('data-room'), 10);
      if (isNaN(n) || n > state.maxUnlocked) return;

      Sound.beep();
      closeModal('mapModal');
      state.current = n;
      saveState();
      loadRoom(n);
    });

    /* --- rewarded ads --- */
    $('hintBtn').addEventListener('click', function () {
      Sound.init();
      Sound.beep();
      if (solved) return;
      showRewardedAdHint();
    });

    $('skipBtn').addEventListener('click', function () {
      Sound.init();
      Sound.beep();
      if (solved) return;
      showRewardedAdSkip();
    });

    /* --- scene hotspots --- */
    var scene = $('scene');
    scene.addEventListener('click', function (e) {
      Sound.init();
      var t = e.target;
      var hs = (t && t.closest) ? t.closest('.hotspot') : null;

      if (hs) {
        var hot = hs.getAttribute('data-hot');
        if (hot) onHotspot(hot);
        return;
      }

      // background tap
      var now = Date.now();
      if (now - lastIdle > 2600 && !solved) {
        lastIdle = now;
        setExpression('worried', 1600);
        say('Tap the objects in the cell — look for a tool and the locked clue!');
      }
    });

    /* --- tool slot --- */
    $('toolSlot').addEventListener('click', function () {
      Sound.init();
      if (collectedTools.length === 0) {
        say('No tool yet. Search the cell!');
        return;
      }
      equipTool();
    });

    /* --- dock keypad button --- */
    $('openKeypadBtn').addEventListener('click', function () {
      Sound.init();
      openKeypad();
    });

    /* --- keypad pad --- */
    $('keypadPad').addEventListener('click', function (e) {
      var t = e.target;
      var btn = (t && t.closest) ? t.closest('.key') : null;
      if (!btn) return;
      var k = btn.getAttribute('data-k');
      if (k) pressKey(k);
    });

    $('kpClose').addEventListener('click', function () {
      closeModal('keypadModal');
    });

    /* --- victory --- */
    $('nextBtn').addEventListener('click', function () {
      Sound.beep();
      closeModal('winModal');
      if (state.current >= 100) {
        renderMap();
        openModal('mapModal');
        return;
      }
      goNextRoom();
    });

    $('shareBtn').addEventListener('click', function () {
      Sound.beep();
      shareRescue();
    });

    /* --- keyboard support --- */
    document.addEventListener('keydown', function (e) {
      if (!$('keypadModal').classList.contains('show')) return;
      if (e.key >= '0' && e.key <= '9') pressKey(e.key);
      else if (e.key === 'Backspace') pressKey('C');
      else if (e.key === 'Enter') pressKey('OK');
    });
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function init() {
    loadState();

    Sound.muted = state.muted;
    $('muteBtn').textContent = state.muted ? '🔇' : '🔊';

    bindEvents();
    loadRoom(state.current);

    closeModal('adModal');
    closeModal('winModal');
    closeModal('mapModal');
    closeModal('keypadModal');
  }

  init();
});
</script>
</body>
</html>
